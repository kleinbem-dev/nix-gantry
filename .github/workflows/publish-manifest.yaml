name: Publish container manifest

# Reusable workflow: build each system's containers, assemble the
# {rev, generated, systems} manifest modules/updater.nix reads, and upload it
# to a rolling release tag (overwritten on every run). Call it like this:
#
#   jobs:
#     publish-manifest:
#       permissions:
#         contents: write
#       uses: kleinbem-dev/nix-gantry/.github/workflows/publish-manifest.yaml@main
#       with:
#         configs: '{"x86_64-linux": "container-factory", "aarch64-linux": "container-factory-aarch64"}'
#         substituters: "https://cache.nixos.org https://cache.example.dev/system"
#         trusted-public-keys: "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= system:..."
#         release-tag: "container-manifest"
#       secrets: inherit
#
# It runs publish-manifest from the caller's locked nix-gantry input, so keep
# that lock at least as new as the workflow ref (trusted-public-keys needs it).

on:
  workflow_call:
    inputs:
      configs:
        description: 'JSON map of system -> nixosConfiguration name, e.g. {"x86_64-linux": "container-factory"}'
        required: true
        type: string
      substituters:
        description: "Space-separated binary cache URLs; a container goes into the manifest only if one of them has it (empty skips the check). This workflow pushes nothing."
        required: true
        type: string
      trusted-public-keys:
        description: "Space-separated keys your hosts trust (their nix.conf trusted-public-keys); every closure path must be signed by one, except content-addressed paths, which Nix (and so the hosts) accepts unsigned. Empty checks presence only."
        required: false
        type: string
        default: ""
      release-tag:
        description: "GitHub release tag the manifest is published to (created if missing, overwritten if present)"
        required: false
        type: string
        default: "container-manifest"
      gantry-input:
        description: "Name of the nix-gantry input in the calling flake; publish-manifest runs from that locked revision"
        required: false
        type: string
        default: "nix-gantry"

permissions:
  contents: read

jobs:
  # A matrix needs a list, and `configs` is a map: take its keys.
  systems:
    runs-on: ubuntu-latest
    outputs:
      systems: ${{ steps.keys.outputs.systems }}
    steps:
      - id: keys
        env:
          CONFIGS: ${{ inputs.configs }}
        run: echo "systems=$(jq -c 'keys' <<<"$CONFIGS")" >> "$GITHUB_OUTPUT"

  build-and-verify:
    needs: systems
    strategy:
      matrix:
        system: ${{ fromJson(needs.systems.outputs.systems) }}
      fail-fast: false
    runs-on: ${{ contains(matrix.system, 'aarch64') && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: kleinbem/actions/nix-setup@7ec628296d5194e6e10031706387b992a10a1638 # v1.0.1
        with:
          nix-path: nixpkgs=channel:nixos-unstable
          # Read-only Attic over NetBird; skipped when the secrets are
          # absent (fork PRs, Dependabot).
          netbird-setup-key: ${{ secrets.NETBIRD_SETUP_KEY_EPHEMERAL }}
          attic-token: ${{ secrets.ATTIC_PULL_TOKEN }}
      - name: Build + verify this system's containers
        id: fragment
        env:
          CONFIGS: ${{ inputs.configs }}
          SUBSTITUTERS: ${{ inputs.substituters }}
          SYSTEM: ${{ matrix.system }}
          GANTRY_INPUT: ${{ inputs.gantry-input }}
          TRUSTED_KEYS: ${{ inputs.trusted-public-keys }}
        run: |
          read -ra subst <<<"$SUBSTITUTERS"
          SUBST_ARGS=()
          for s in "${subst[@]}"; do
            SUBST_ARGS+=(--substituter "$s")
          done
          config=$(jq -r --arg sys "$SYSTEM" '.[$sys]' <<<"$CONFIGS")
          # Only with keys set: an older locked publish-manifest doesn't know the flag.
          KEY_ARGS=()
          if [ -n "$TRUSTED_KEYS" ]; then
            KEY_ARGS=(--trusted-public-keys "$TRUSTED_KEYS")
          fi
          # The caller's checkout has no publish-manifest app; run the one from
          # its locked nix-gantry input.
          nix run --inputs-from . "$GANTRY_INPUT#publish-manifest" -- \
            --flake-ref . --config "$config" --system "$SYSTEM" \
            "${KEY_ARGS[@]}" "${SUBST_ARGS[@]}" > fragment.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-fragment-${{ matrix.system }}
          path: fragment.json

  merge-and-publish:
    needs: build-and-verify
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release create/upload
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: manifest-fragment-*
          path: fragments
      - name: Assemble manifest
        env:
          REV: ${{ github.sha }}
        run: |
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SYSTEMS=$(jq -s 'add' fragments/*/fragment.json)
          jq -n --arg rev "$REV" --arg date "$DATE" --argjson systems "$SYSTEMS" \
            '{rev: $rev, generated: $date, systems: $systems}' > manifest.json
          cat manifest.json
      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout in this job, so gh needs the repo spelled out.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release-tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --notes "Rolling container manifest" --latest=false
          fi
          gh release upload "$TAG" manifest.json --clobber
