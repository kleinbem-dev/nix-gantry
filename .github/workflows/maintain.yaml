name: Maintain Flake
on:
  workflow_dispatch:
  schedule:
    # 02:45 UTC, after the sub-flakes.
    - cron: '45 2 * * *'

# Nightly flake.lock PR, shared: kleinbem/actions' maintain-flake.
permissions: {}

jobs:
  maintain:
    uses: kleinbem/actions/.github/workflows/maintain-flake.yaml@d5aec5d8fbed30867e0b2c1d781992844240ee1e # v1.10.0
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
