name: Maintain Flake
on:
  workflow_dispatch:
  schedule:
    # 02:45 UTC, after the sub-flakes.
    - cron: '45 2 * * *'

# Nightly flake.lock PR, shared: kleinbem/actions' maintain-flake.
permissions: {}

jobs:
  maintain:
    uses: kleinbem/actions/.github/workflows/maintain-flake.yaml@b3ffb6b2eeb888969e5f16640c84a55956581542 # v1.9.0
    secrets:
      app-id: ${{ secrets.APP_ID }}
      app-private-key: ${{ secrets.APP_PRIVATE_KEY }}
